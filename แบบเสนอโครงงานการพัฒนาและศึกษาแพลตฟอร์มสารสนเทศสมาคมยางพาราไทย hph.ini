-- 1. ตารางสมาชิกและบทบาท (Users)
CREATE TABLE users (
    user_id INT AUTO_INCREMENT PRIMARY KEY,
    fullname VARCHAR(150) NOT NULL,
    company_name VARCHAR(150),
    email VARCHAR(100) UNIQUE NOT NULL,
    password_hash VARCHAR(255) NOT NULL,
    phone VARCHAR(20),
    member_type ENUM('Regular', 'Associate', 'Affiliate', 'Honorary', 'Admin') DEFAULT 'Affiliate',
    status ENUM('Active', 'Pending', 'Suspended') DEFAULT 'Active',
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
);

-- 2. ตารางราคายางพาราประจำวัน (Rubber Prices)
CREATE TABLE rubber_prices (
    price_id INT AUTO_INCREMENT PRIMARY KEY,
    product_name VARCHAR(100) NOT NULL, -- ยางแผ่นรมควัน RSS3, น้ำยางสด, ยางแท่ง STR20
    price_fob DECIMAL(10,2) DEFAULT 0.00,
    price_local DECIMAL(10,2) DEFAULT 0.00,
    unit VARCHAR(20) DEFAULT 'บาท/กก.',
    price_date DATE NOT NULL,
    price_change DECIMAL(5,2) DEFAULT 0.00,
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
);

-- 3. ตารางหมวดหมู่สินค้า (Categories)
CREATE TABLE categories (
    category_id INT AUTO_INCREMENT PRIMARY KEY,
    name VARCHAR(100) NOT NULL,
    icon VARCHAR(50) DEFAULT 'fa-leaf'
);

-- 4. ตารางสินค้าตลาดกลาง (Marketplace Products)
CREATE TABLE products (
    product_id INT AUTO_INCREMENT PRIMARY KEY,
    user_id INT,
    category_id INT,
    title VARCHAR(255) NOT NULL,
    description TEXT,
    price DECIMAL(10,2) NOT NULL,
    unit VARCHAR(30) DEFAULT 'กิโลกรัม',
    stock_quantity DECIMAL(12,2) NOT NULL,
    location VARCHAR(150), -- เช่น สงขลา, ยะลา, สุราษฎร์ธานี
    image_url VARCHAR(255),
    is_flash_sale TINYINT(1) DEFAULT 0,
    sales_count INT DEFAULT 0,
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    FOREIGN KEY (user_id) REFERENCES users(user_id) ON DELETE SET NULL,
    FOREIGN KEY (category_id) REFERENCES categories(category_id)
);

-- 5. ตารางคำสั่งซื้อและการสั่งซื้อ (Orders & Order Items)
CREATE TABLE orders (
    order_id INT AUTO_INCREMENT PRIMARY KEY,
    user_id INT,
    customer_name VARCHAR(150) NOT NULL,
    customer_phone VARCHAR(20) NOT NULL,
    customer_address TEXT NOT NULL,
    total_amount DECIMAL(12,2) NOT NULL,
    payment_status ENUM('pending', 'paid', 'cancelled') DEFAULT 'pending',
    order_status ENUM('pending', 'processing', 'shipped', 'completed') DEFAULT 'pending',
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
);

CREATE TABLE order_items (
    item_id INT AUTO_INCREMENT PRIMARY KEY,
    order_id INT,
    product_id INT,
    quantity DECIMAL(10,2) NOT NULL,
    unit_price DECIMAL(10,2) NOT NULL,
    subtotal DECIMAL(12,2) NOT NULL,
    FOREIGN KEY (order_id) REFERENCES orders(order_id) ON DELETE CASCADE,
    FOREIGN KEY (product_id) REFERENCES products(product_id)
);

-- 6. ตารางกระดานข่าวซื้อขาย / เว็บบอร์ด (Webboard Topics & Replies)
CREATE TABLE webboard_topics (
    topic_id INT AUTO_INCREMENT PRIMARY KEY,
    user_id INT,
    category VARCHAR(50) NOT NULL,
    title VARCHAR(255) NOT NULL,
    content TEXT NOT NULL,
    image_path VARCHAR(255),
    views INT DEFAULT 0,
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
    FOREIGN KEY (user_id) REFERENCES users(user_id)
);
